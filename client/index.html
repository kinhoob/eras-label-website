<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- SEO Principal e Metatags de Indexação -->
    <title>Eras Label - Loja Oficial</title>
    <meta name="description" content="Plataforma oficial da Eras Label. Streetwear de alta qualidade, coleções exclusivas, curadoria rigorosa e entrega para todo o Brasil com Mercado Pago e Melhor Envio." />
    <meta name="keywords" content="Eras Label, streetwear brasil, roupas oversized, camisetas premium, moda masculina feminina, curadoria eras" />
    <meta name="author" content="Eras Label" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.eraslabel.com/" />

    <!-- Favicon oficial em vetor: preserva a nitidez do ícone em diferentes densidades de ecrã. -->
    <link rel="icon" type="image/svg+xml" href="/manus-storage/ERAS_Vetor_1c95859d.svg" />
    <!-- Fallback raster de alta compatibilidade para navegadores que exigem PNG/ICO. -->
    <link rel="alternate icon" type="image/png" href="/manus-storage/IMG_0880_f28b1a89.png" />
    <!-- Ícone para ecrã inicial do iOS (iPhone/iPad) e Safari; utiliza a imagem PNG oficial fornecida. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/manus-storage/IMG_0880_f28b1a89.png" />

    <!-- Open Graph / WhatsApp / Facebook para Partilhas Sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.eraslabel.com/" />
    <meta property="og:title" content="Eras Label - Loja Oficial" />
    <meta property="og:description" content="Streetwear de alta qualidade, coleções exclusivas e curadoria rigorosa da Eras Label. Descubra as novas eras." />
    <meta property="og:image" content="https://www.eraslabel.com/manus-storage/previewssiteeras_6fb21842.png" />
    <meta property="og:image:secure_url" content="https://www.eraslabel.com/manus-storage/previewssiteeras_6fb21842.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Eras Label" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eras Label - Loja Oficial" />
    <meta name="twitter:description" content="Streetwear de alta qualidade e coleções exclusivas. Descubra a nova era." />
    <meta name="twitter:image" content="https://www.eraslabel.com/manus-storage/previewssiteeras_6fb21842.png" />

    <!-- Fontes e Estilos Globais -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Elemento raiz onde a aplicação React é montada -->
    <div id="root"></div>

    <!-- SDK Oficial do Mercado Pago para Checkout Transparente -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <!-- Script de Inicialização da Aplicação Frontend -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Analytics Integrado com Configuração Segura -->
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
